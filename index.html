<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="遺物商隊">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>遺物商隊 Relic Caravan</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0e0a14;color:#d8cdb8;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;text-align:center;
    overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  /* 整頁改成「標題 + 遊戲」直排，遊戲區吃掉剩下的所有空間，Phaser FIT 依此等比縮放 */
  #shell{display:flex;flex-direction:column;height:100vh;height:100dvh;box-sizing:border-box;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    /* 左右安全區取兩側較大值、兩邊相同，避免瀏海那側較寬而讓畫面偏向一邊 */
    padding-left:max(env(safe-area-inset-left),env(safe-area-inset-right));
    padding-right:max(env(safe-area-inset-left),env(safe-area-inset-right))}
  header{flex:0 0 auto}
  h1{font-size:18px;margin:12px 0 2px;letter-spacing:3px;color:#e7c14a}
  p.sub{margin:0 0 8px;color:#8a7f9a;font-size:12px}
  #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px 12px;box-sizing:border-box}
  #game{width:100%;height:100%;max-width:1400px;touch-action:none}
  #game canvas{border:3px solid #2a2238;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.6);box-sizing:border-box}
  /* 手機、矮螢幕、全螢幕：拿掉標題與留白，畫面最大化 */
  @media (max-height:700px),(max-width:820px),(pointer:coarse){
    header{display:none}
    #stage{padding:0}
    #game canvas{border:0;border-radius:0;box-shadow:none}
  }
  :fullscreen header{display:none}
  :fullscreen #stage{padding:0}
  :fullscreen #game canvas{border:0;border-radius:0;box-shadow:none}

  /* 全螢幕按鈕：放右下角，橫向時落在左右黑邊 */
  #fsBtn{position:fixed;z-index:20;right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));
    width:40px;height:40px;display:grid;place-items:center;border:1px solid #3a3150;border-radius:10px;
    background:rgba(20,15,30,.72);color:#e7c14a;cursor:pointer;opacity:.7;padding:0;touch-action:manipulation}
  #fsBtn:hover{opacity:1}
  #fsBtn[hidden]{display:none}
  #fsBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* 手機直拿時的提示：建議橫拿，也可以選擇直接玩 */
  #rotateHint{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;background:rgba(14,10,20,.94);color:#d8cdb8;font-size:15px;line-height:1.6}
  #rotateHint .phone{width:46px;height:76px;border:3px solid #e7c14a;border-radius:9px;animation:rc-rot 1.8s ease-in-out infinite}
  #rotateHint strong{color:#e7c14a;font-size:18px;letter-spacing:2px}
  #rotateHint button{margin-top:6px;padding:10px 18px;border:1px solid #7a6f93;border-radius:10px;background:#2a2238;color:#d8cdb8;font:inherit;font-size:14px;touch-action:manipulation}
  #rotateHint button.primary{border-color:#e7c14a;color:#1a1424;background:#e7c14a;font-weight:700}
  @keyframes rc-rot{0%,25%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
  @media (orientation:portrait) and (pointer:coarse){ body:not(.hint-dismissed) #rotateHint{display:flex} }
  /* 關於／開發者資訊：桌機放在標題列（與說明文字分開），手機與全螢幕改用右下角（全螢幕鈕上方）的小按鈕，都落在畫面外的黑邊。
     視窗沿用遊戲 panel()／sceneHeader() 的樣式：深靛面板、金色粗邊＋左側色條、內外光暈、標題兩側「•——」裝飾 */
  p.sub .about-link{margin-left:14px;padding:2px 10px;border:1px solid rgba(242,193,78,.45);border-radius:9px;background:rgba(242,193,78,.08);
    color:#f2c14e;font:inherit;font-size:13px;line-height:1.4;letter-spacing:1px;cursor:pointer;vertical-align:baseline}
  p.sub .about-link:hover,p.sub .about-link:focus-visible{color:#ffd978;border-color:#f2c14e;background:rgba(242,193,78,.16);outline:none}
  #aboutBtn{position:fixed;z-index:20;right:calc(6px + env(safe-area-inset-right));bottom:calc(56px + env(safe-area-inset-bottom));
    width:44px;height:44px;display:none;place-items:center;border:1px solid #3a3150;border-radius:10px;
    background:rgba(20,15,30,.72);color:#e7c14a;cursor:pointer;opacity:.7;padding:0;font:700 18px/1 Georgia,serif;touch-action:manipulation}
  #aboutBtn:hover{opacity:1}
  @media (max-height:700px),(max-width:820px),(pointer:coarse){ #aboutBtn{display:grid} }
  :fullscreen #aboutBtn{display:grid}
  #aboutDlg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;box-sizing:border-box;
    padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    background:rgba(7,6,15,.78);user-select:text;-webkit-user-select:text}
  #aboutDlg.open{display:flex}
  #aboutDlg .card{position:relative;width:min(360px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:14px 18px 14px 23px;
    border:2px solid rgba(242,193,78,.85);border-left-width:6px;border-radius:14px;
    background:linear-gradient(rgba(36,30,68,.55),rgba(36,30,68,.55)) top/100% 64px no-repeat,#1b1736;
    box-shadow:0 7px 0 2px rgba(0,0,0,.42),0 0 22px rgba(242,193,78,.22),inset 0 0 18px rgba(242,193,78,.08),inset 0 1px 0 rgba(255,255,255,.05);
    color:#ece6d6;text-align:left;font-size:14px;line-height:1.5}
  #aboutDlg h2{margin:0 34px 12px;white-space:nowrap;padding:8px 0 12px;border-bottom:1px solid rgba(242,193,78,.25);
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:16px;font-weight:700;letter-spacing:1px;color:#f2c14e;text-shadow:0 0 2px #07060f,0 2px 4px #000}
  #aboutDlg h2::before,#aboutDlg h2::after{content:"";flex:0 0 18px;height:2px;background:rgba(242,193,78,.7)}
  #aboutDlg h2 .dot{flex:0 0 6px;height:6px;border-radius:50%;background:rgba(242,193,78,.9);order:1}
  #aboutDlg h2 .dot:first-child{order:-1}
  #aboutDlg dl{margin:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 12px}
  #aboutDlg dt{color:#b8b0c8;font-size:13px;text-align:right}
  #aboutDlg dd{margin:0;min-width:0}
  #aboutDlg dd.name{font-weight:700;color:#ece6d6;font-size:15px;padding:4px 0}
  #aboutDlg a{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;box-sizing:border-box;padding:0 12px;
    border:1.5px solid #423a72;border-radius:10px;background:#2a2350;color:#f2c14e;text-decoration:none;font-size:14px;white-space:nowrap;touch-action:manipulation}
  #aboutDlg a .ext{flex:0 0 auto;color:#9b93b8;font-size:13px}
  #aboutDlg a .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
  #aboutDlg a:hover,#aboutDlg a:focus-visible{background:#372d66;border-color:#f2c14e;outline:none}
  #aboutDlg a:hover .ext{color:#f2c14e}
  /* 重看教學：與連結同款按鈕，手機可點高度 44px */
  #aboutDlg .tut{margin:12px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px}
  #aboutDlg .tut button{min-height:44px;min-width:180px;padding:0 18px;border:1.5px solid #423a72;border-radius:10px;background:#2a2350;
    color:#f2c14e;font:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;touch-action:manipulation}
  #aboutDlg .tut button:hover,#aboutDlg .tut button:focus-visible{background:#372d66;border-color:#f2c14e;outline:none}
  #aboutDlg .tut span{color:#9b93b8;font-size:12px;text-align:center}
  #aboutDlg .tut span:empty{display:none}
  #aboutDlg .ver{margin:12px 0 0;text-align:center;color:#9b93b8;font-size:12px;letter-spacing:1px}
  /* 矮螢幕（手機橫向）：連結改兩欄，整個視窗不用捲動就看得完 */
  @media (max-height:440px) and (min-width:520px){
    #aboutDlg .card{width:min(700px,100%)}
    #aboutDlg dl{grid-template-columns:auto 1fr auto 1fr}
    #aboutDlg dd.name{grid-column:2 / -1}
  }
  #aboutClose{position:absolute;top:2px;right:2px;width:44px;height:44px;padding:0;border:0;border-radius:10px;background:none;color:#9b93b8;font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation}
  #aboutClose:hover,#aboutClose:focus-visible{color:#f2c14e;outline:none}
</style>
</head>
<body>
  <div id="shell">
    <header>
      <h1>遺物商隊 · Relic Caravan</h1>
      <p class="sub">整備 → 地城選路 → 自動戰鬥 → 帶回遺物　|　一趟完整 run<button id="aboutLink" class="about-link" type="button">關於</button></p>
    </header>
    <div id="stage"><div id="game"></div></div>
  </div>
  <button id="fsBtn" type="button" aria-label="全螢幕" title="全螢幕" hidden></button>
  <button id="aboutBtn" type="button" aria-label="關於" title="關於">i</button>
  <div id="aboutDlg" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="card">
      <button id="aboutClose" type="button" aria-label="關閉">✕</button>
      <h2 id="aboutTitle"><span class="dot" aria-hidden="true"></span>關於 遺物商隊<span class="dot" aria-hidden="true"></span></h2>
      <dl>
        <dt>開發者</dt><dd class="name">SY</dd>
        <dt>GitHub</dt><dd><a href="https://github.com/SY19870627" target="_blank" rel="noopener noreferrer"><span class="t">github.com/SY19870627</span><span class="ext" aria-hidden="true">↗</span></a></dd>
        <dt>X</dt><dd><a href="https://x.com/nelsonyehfon" target="_blank" rel="noopener noreferrer"><span class="t">x.com/nelsonyehfon</span><span class="ext" aria-hidden="true">↗</span></a></dd>
        <dt>Threads</dt><dd><a href="https://www.threads.com/@ye.c.feng" target="_blank" rel="noopener noreferrer"><span class="t">threads.com/@ye.c.feng</span><span class="ext" aria-hidden="true">↗</span></a></dd>
        <dt>方格子</dt><dd><a href="https://vocus.cc/user/@SY19870627" target="_blank" rel="noopener noreferrer"><span class="t">vocus.cc/user/@SY19870627</span><span class="ext" aria-hidden="true">↗</span></a></dd>
      </dl>
      <div class="tut"><button id="tutReplay" type="button">重看教學</button><span id="tutMsg" role="status"></span></div>
      <p class="ver" id="aboutVer"></p>
    </div>
  </div>
  <div id="rotateHint" role="dialog" aria-label="建議橫向遊玩">
    <div class="phone" aria-hidden="true"></div>
    <strong>請把手機橫過來</strong>
    <div>遊戲畫面是橫式設計，橫拿會清楚很多</div>
    <button id="rotateFs" class="primary" type="button" hidden>全螢幕並橫向遊玩</button>
    <button id="rotateSkip" type="button">直接直向遊玩</button>
  </div>

  <!-- 多檔架構：依相依順序以傳統 script 載入（仍可 file:// 直接開啟）。
       v2.4：統一版本號 APP_VER —— 改版只要把下面這一個數字 +1，所有檔案的快取一起失效。 -->
  <script>
    const APP_VER = 151;
    [
      'js/config.js',                 // 平衡設定：所有可調數值集中於此
      'js/data.js',                   // 純資料：調色盤、精靈、裝備、職業、技能
      'js/envdata.js',                // v3.0 戰場環境系統：物件/天氣/神祉/技能親和（資料）
      'js/trialdata.js',              // v4.1 單人晉升試煉：五職業×4 關卡定義（資料）
      'js/state.js',                  // 全域狀態、存檔、設施/祝福/聲望、職業數值
      'js/ui.js',                     // 共用繪圖工具：貼圖、文字、跳數字、按鈕
      'js/tutorial.js',               // 新手教學：大廳高亮引導、第一場戰鬥說明、各功能首次提示、重看
      'js/scenes/boot.js',
      'js/scenes/guildhall.js',
      'js/scenes/wagonhall.js',       // 馬車強化所：選用＋升級貨車
      'js/scenes/warehousehall.js',   // 倉庫所：查看持有物品
      'js/scenes/questhall.js',       // 任務/懸賞：擊殺任務、領聲望、裝備稱號
      'js/scenes/formationhall.js',   // 隊形：選擇陣形
      'js/scenes/recruithall.js',     // 招募所：第四職業法師
      'js/scenes/skilltreehall.js',   // 職業規劃器：配置技能 build（大改版）
      'js/scenes/trialhall.js',       // v4.1 試煉之間：單人晉升試煉（簡報/關卡選擇）
      'js/scenes/simlab.js',          // v10.0 模擬實驗室：無後果試招沙盒
      'js/scenes/outfit.js',
      'js/scenes/worldmap.js',        // 世界地圖：選目的地
      'js/scenes/map.js',             // 含地圖場景與探險邏輯（掉落、遭遇、換裝）
      'js/scenes/battle.js',          // Battle 場景本體：class 定義＋場景生命週期/設定/HUD/出手迴圈
      'js/scenes/battle.combat.js',   // 擴充：戰鬥結算（攻擊/治療/傷害/護盾血條/死亡/特效）
      'js/scenes/battle.events.js',   // 擴充：非戰鬥遭遇（寶箱/紮營/料理/換裝/道具/商店/事件）
      'js/scenes/battle.menu.js',     // 擴充：暫停選單＋設定
      'js/scenes/battle.env.js',      // v3.0 戰場環境系統：物件實體/光環/招牌互動/天氣特效（邏輯）
      'js/scenes/result.js',
      'js/main.js',                   // 啟動 Phaser.Game
      'js/mobile.js',                 // 手機：全螢幕、橫向提示、觸控滑動捲動
      'js/about.js',                  // 關於：開發者資訊視窗
    ].forEach(s=>document.write('<script src="'+s+'?v='+APP_VER+'"><\/script>'));
  </script>
</body>
</html>
